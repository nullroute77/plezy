name: Plex current program timeline test builds
run-name: Plex current program timeline testing — ${{ github.sha }}

on:
  # A new workflow cannot be manually dispatched until registered on the
  # default branch. Push starts this fork-only build without changing main.
  push:
    branches: [codex/plex-current-program-timeline-build-469ceaf1e]
  workflow_dispatch:

env:
  TEST_BASE_COMMIT: 8310991fa14f0cbac9c71cfb494d028d4314c7ff
  TEST_SOURCE_COMMIT: 469ceaf1e06751b7846c8ba3ad946566c3c3eec3

permissions:
  contents: read

concurrency:
  group: plex-current-program-timeline-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Windows x64 portable
    if: github.repository == 'nullroute77/plezy' && github.ref == 'refs/heads/codex/plex-current-program-timeline-build-469ceaf1e'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact feature source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$TEST_SOURCE_COMMIT"
          git merge-base --is-ancestor "$TEST_BASE_COMMIT" "$TEST_SOURCE_COMMIT"
          git diff --exit-code "$TEST_BASE_COMMIT" "$TEST_SOURCE_COMMIT" -- android ios macos linux windows packages mpv-build.lock.json pubspec.yaml pubspec.lock
          git diff --exit-code "$TEST_SOURCE_COMMIT" HEAD -- . ':!.github/workflows/plex-current-program-timeline-test.yml'

      # Reuse the repository's immutable Flutter pin, avoiding archive lookup.
      - name: Set up pinned Flutter SDK
        uses: ./.github/actions/setup-flutter-git

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Install patched Windows engine
        run: |
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { throw "Flutter precache failed" }
          .\windows\tool\install-patched-engine.ps1

      - name: Build Windows x64 portable bundle
        run: >-
          flutter build windows --release
          --dart-define=ENABLE_UPDATE_CHECK=false
          --dart-define=ENABLE_SENTRY=false
          --dart-define=GIT_COMMIT=${{ env.TEST_SOURCE_COMMIT }}

      - name: Verify bundle and record build identity
        env:
          TEST_COMMIT: ${{ github.sha }}
          TEST_REF: ${{ github.ref_name }}
        run: |
          $bundle = "build/windows/x64/runner/Release"
          $required = @(
            "plezy.exe", "flutter_windows.dll", "sqlite3.dll", "libmpv-2.dll",
            "msvcp140.dll", "vcruntime140.dll", "vulkan-1.dll", "VulkanRT-License.txt",
            "data/app.so", "data/icudtl.dat",
            "data/flutter_assets/NativeAssetsManifest.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundle $file) -PathType Leaf) -or (Get-Item -LiteralPath (Join-Path $bundle $file)).Length -eq 0) {
              throw "Required portable file is missing: $file"
            }
          }
          foreach ($file in @("plezy.lib", "plezy.exp", "simdutf.lib")) {
            if (Test-Path -LiteralPath (Join-Path $bundle $file)) {
              throw "Unexpected link by-product in portable bundle: $file"
            }
          }
          if (Get-ChildItem -LiteralPath $bundle -Recurse -Filter '*.pdb') {
            throw "Debug symbols must not ship in the portable bundle"
          }
          $sdkRoot = Split-Path -Parent (Split-Path -Parent (Get-Command flutter).Source)
          $expectedEngine = Join-Path $sdkRoot "bin/cache/artifacts/engine/windows-x64-release/flutter_windows.dll"
          if ((Get-FileHash $expectedEngine).Hash -ne (Get-FileHash (Join-Path $bundle "flutter_windows.dll")).Hash) {
            throw "Packaged engine differs from the installed patched release engine"
          }
          python -c "import os,pathlib; assert os.environ['TEST_SOURCE_COMMIT'].encode() in pathlib.Path('build/windows/x64/runner/Release/data/app.so').read_bytes()"
          if ($LASTEXITCODE -ne 0) { throw "Compiled Windows source identity mismatch" }
          @(
            "Plezy Windows x64 test build",
            "Commit: $env:TEST_COMMIT",
            "Branch: $env:TEST_REF",
            "Source commit: 469ceaf1e06751b7846c8ba3ad946566c3c3eec3",
            "Source branch: codex/plex-current-program-timeline",
            "Extract the complete ZIP and run plezy.exe.",
            "Automatic update checks and Sentry are disabled for this test build.",
            "Current-program timeline with channel and program title, scheduled bounds, and capture-buffer shading. Real Plex playback validation pending."
          ) | Set-Content -LiteralPath (Join-Path $bundle "TEST-BUILD.txt") -Encoding utf8

      - name: Record runtime file checksums
        run: |
          $bundle = (Resolve-Path "build/windows/x64/runner/Release").Path
          $files = Get-ChildItem -LiteralPath $bundle -File -Recurse | ForEach-Object {
            [ordered]@{
              path = $_.FullName.Substring($bundle.Length + 1).Replace('\', '/')
              bytes = $_.Length
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            }
          }
          [ordered]@{
            source_commit = $env:TEST_SOURCE_COMMIT
            build_commit = '${{ github.sha }}'
            files = @($files)
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $bundle 'BUILD-MANIFEST.json') -Encoding utf8

      # GitHub packages the complete folder as a downloadable ZIP artifact.
      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-windows-x64-current-program-timeline-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  android-tv-arm64:
    name: Android TV ARM64 APK
    if: github.repository == 'nullroute77/plezy' && github.ref == 'refs/heads/codex/plex-current-program-timeline-build-469ceaf1e'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify feature source
        run: test "$(git rev-parse HEAD^)" = "$TEST_SOURCE_COMMIT"

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pinned Flutter SDK
        uses: ./.github/actions/setup-flutter-git

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      # This is a disposable test identity, never the production signing key.
      # Reuse it so consecutive test APKs can update one another in place.
      - name: Restore test signing key
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.android/plezy-test.keystore
          key: plezy-android-test-signing-v1

      - name: Configure test signing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/plezy-test.keystore" ]; then
            keytool -genkeypair -noprompt -storetype JKS \
              -keystore "$HOME/.android/plezy-test.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Plezy Fork Test, O=Android, C=US"
          fi
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$HOME/.android/plezy-test.keystore
          EOF

      # Plezy's regular Android app already declares the TV launcher and
      # detects Android TV; no separate TV flavor or forced UI is needed.
      - name: Build Android TV ARM64 APK
        run: >-
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          --dart-define=ENABLE_UPDATE_CHECK=false
          --dart-define=ENABLE_SENTRY=false
          --dart-define=GIT_COMMIT=${{ env.TEST_SOURCE_COMMIT }}

      - name: Verify APK and record build identity
        env:
          TEST_COMMIT: ${{ github.sha }}
          TEST_REF: ${{ github.ref_name }}
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify "$apk"
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-arm64-v8a-release.apk') as apk:
              abis = {name.split('/')[1] for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')}
              if abis != {'arm64-v8a'}:
                  raise SystemExit(f'Expected only ARM64 native libraries, found {sorted(abis)}')
          PY
          mkdir -p build/android-tv-test
          cp "$apk" build/android-tv-test/plezy-androidtv-arm64-test.apk
          cat > build/android-tv-test/TEST-BUILD.txt <<EOF
          Plezy Android TV ARM64 test build
          Commit: $TEST_COMMIT
          Branch: $TEST_REF
          Install plezy-androidtv-arm64-test.apk on a 64-bit Android TV device.
          Uses Plezy's existing Android TV detection and TV launcher.
          Signed with a test key, so it cannot update an official release installation.
          Test updates reuse the signing key while the GitHub Actions cache retains it.
          Automatic update checks and Sentry are disabled.
          Source commit: $TEST_SOURCE_COMMIT
          EOF

      - name: Remove signing configuration
        if: always()
        run: rm -f android/key.properties

      - name: Upload Android TV ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-androidtv-arm64-test-${{ github.sha }}
          path: build/android-tv-test/
          if-no-files-found: error
          retention-days: 14
