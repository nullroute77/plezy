name: Chromecast ARMv7 test build
run-name: Chromecast ARMv7 testing — ${{ github.sha }}

on:
  # A new workflow cannot be manually dispatched until registered on the
  # default branch. Push starts this fork-only build without changing main.
  push:
    branches: [codex/merged-feature-chromecast-build]
  workflow_dispatch:

env:
  TEST_SOURCE_COMMIT: 0ab6f1b9d11ec3b41d98541b42bda406dcdb900b

permissions:
  contents: read

concurrency:
  group: chromecast-armv7-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ARMv7 release APK
    if: github.repository == 'nullroute77/plezy' && github.ref == 'refs/heads/codex/merged-feature-chromecast-build'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact feature source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TEST_SOURCE_COMMIT" HEAD
          git diff --exit-code "$TEST_SOURCE_COMMIT" HEAD -- . ':!.github/workflows/merged-feature-test.yml'

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up repository-pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          # Read the same immutable pin used by the Windows setup action.
          python3 - <<'PYSDK'
          import os, pathlib, re
          source = pathlib.Path('.github/actions/setup-flutter-git/action.yml').read_text()
          version = re.search(r'\$version = "([0-9.]+)"', source).group(1)
          commit = re.search(r'\$expectedCommit = "([0-9a-f]{40})"', source).group(1)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'TEST_FLUTTER_VERSION={version}\nTEST_FLUTTER_COMMIT={commit}\n')
          PYSDK

      - name: Bootstrap pinned Flutter on Linux
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/flutter"
          git init "$sdk"
          git -C "$sdk" remote add origin https://github.com/flutter/flutter.git
          git -C "$sdk" fetch --depth 1 origin "refs/tags/$TEST_FLUTTER_VERSION:refs/tags/$TEST_FLUTTER_VERSION"
          git -C "$sdk" checkout --detach "refs/tags/$TEST_FLUTTER_VERSION"
          test "$(git -C "$sdk" rev-parse HEAD)" = "$TEST_FLUTTER_COMMIT"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          "$sdk/bin/flutter" --version
          "$sdk/bin/flutter" --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python3 - <<'PYSDK'
          import json, os, pathlib
          version = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'flutter-version.json').read_text())
          assert version['frameworkVersion'] == os.environ['TEST_FLUTTER_VERSION']
          PYSDK

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Configure isolated test signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/merged-feature-test.jks" -storepass android -keypass android -alias androiddebugkey -dname "CN=Plezy Chromecast ARMv7 Test" -keyalg RSA -keysize 2048 -validity 3650
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$RUNNER_TEMP/merged-feature-test.jks
          EOF

      - name: Build ARMv7 release APK
        run: >-
          flutter build apk --release --target-platform android-arm --split-per-abi
          --dart-define=ENABLE_UPDATE_CHECK=false
          --dart-define=ENABLE_SENTRY=false
          --dart-define=GIT_COMMIT=${{ env.TEST_SOURCE_COMMIT }}

      - name: Verify APK and record identity
        shell: bash
        env:
          TEST_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p test-artifacts
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk test-artifacts/plezy-android-armv7-chromecast-test.apk
          apk=test-artifacts/plezy-android-armv7-chromecast-test.apk
          build_tools="$ANDROID_HOME/build-tools/36.1.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee test-artifacts/apk-signature.txt
          "$build_tools/zipalign" -c -P 4 -v 4 "$apk" > test-artifacts/apk-alignment.txt
          "$build_tools/aapt" dump badging "$apk" > test-artifacts/apk-badging.txt
          python3 - <<'PYAPK'
          import hashlib, os, pathlib, struct, zipfile
          apk = pathlib.Path('test-artifacts/plezy-android-armv7-chromecast-test.apk')
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              abis = {name.split('/')[1] for name in names if name.startswith('lib/') and name.endswith('.so')}
              assert abis == {'armeabi-v7a'}, abis
              for library in ['libapp.so', 'libflutter.so', 'libmpv.so', 'libplayer.so', 'libc++_shared.so', 'libffmpegJNI.so', 'libdovi_bridge.so']:
                  assert archive.getinfo(f'lib/armeabi-v7a/{library}').file_size > 0, library
              for name in names:
                  if name.startswith('lib/') and name.endswith('.so'):
                      data = archive.read(name)
                      assert data[:4] == b'\x7fELF' and data[4:6] == bytes([1, 1]), name
                      assert struct.unpack_from('<H', data, 18)[0] == 40, name
                      offset = struct.unpack_from('<I', data, 28)[0]
                      size, count = struct.unpack_from('<HH', data, 42)
                      loads = [struct.unpack_from('<I', data, offset + i * size + 28)[0]
                               for i in range(count) if struct.unpack_from('<I', data, offset + i * size)[0] == 1]
                      assert loads and min(loads) >= 4096, (name, loads)
              assert os.environ['TEST_SOURCE_COMMIT'].encode() in archive.read('lib/armeabi-v7a/libapp.so')
              pathlib.Path('test-artifacts/apk-files.txt').write_text('\n'.join(names) + '\n')
          pathlib.Path('test-artifacts/TEST-BUILD.txt').write_text(
              'Plezy Android ARMv7 release test build\n'
              f'Build commit: {os.environ["TEST_COMMIT"]}\n'
              'Source commit: 0ab6f1b9d11ec3b41d98541b42bda406dcdb900b\n'
              'Source branch: merged-feature-test\n'
              '32-bit ARM APK for Chromecast with Google TV. Release mode, test signed. Updates and Sentry disabled. Real-device validation pending.\n')
          pathlib.Path(str(apk) + '.sha256').write_text(hashlib.sha256(apk.read_bytes()).hexdigest() + '  ' + apk.name + '\n')
          PYAPK

      - name: Remove temporary signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/merged-feature-test.jks"

      - name: Upload ARMv7 test package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-android-armv7-chromecast-test-${{ github.sha }}
          path: test-artifacts/
          if-no-files-found: error
          retention-days: 14
